[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "coderl-optimizer"
version = "2.0.0"
description = "LangGraph C++ optimization agent with measured rewards and PyTorch GRPO"
requires-python = ">=3.11"
dependencies = ["torch>=2.5,<3", "langgraph>=1.0,<2", "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "httpx>=0.27,<1", "numpy>=1.26,<3", "pyarrow>=17,<25", "pyyaml>=6,<7"]

[project.optional-dependencies]
llm = ["transformers>=4.51,<6", "peft>=0.15,<1", "accelerate>=1,<2"]
test = ["pytest>=8,<10"]

[project.scripts]
coderl = "coderl.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
coderl = ["*.cpp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
