services:
  tools:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    networks: [worker_internal]
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 128
    mem_limit: 2g
    cpus: 1
    tmpfs:
      - /tmp:size=128m,mode=1777
      - /worker:size=512m,uid=10001,gid=10001,mode=0700,exec
networks:
  worker_internal:
    internal: true
